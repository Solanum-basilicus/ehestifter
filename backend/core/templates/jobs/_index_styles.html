<style>
  .hidden { display:none; }
  .title-link { font-weight:600; text-decoration:none; }
  .title-link:hover { text-decoration:underline; }
  .mono { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }

  .chip {
    border:1px solid #ddd;
    border-radius:999px;
    padding:2px 8px;
    font-size:12px;
    line-height:20px;
  }
  .chip.muted { opacity:.75; }

  .tabs { display:flex; gap:8px; margin:8px 0 12px; flex-wrap:wrap; }
  .tab {
    padding:6px 12px;
    border:1px solid #e5e7eb;
    border-radius:999px;
    background:#fff;
    cursor:pointer;
  }
  .tab.active {
    background:#111827;
    color:#fff;
    border-color:#111827;
  }

  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .input, .select, .button {
    border:1px solid #e5e7eb;
    border-radius:8px;
    padding:8px 10px;
    background:#fff;
  }
  .button { cursor:pointer; }

  .list-controls {
    border:1px solid #e5e7eb;
    border-radius:12px;
    background:#fff;
    padding:10px 12px;
    margin:12px 0;
  }

  .filters {
    display:block;
    border-top:1px dashed #e5e7eb;
    padding-top:10px;
    margin-top:8px;
  }
  .filters-header {
    display:flex;
    align-items:flex-start;
    gap:12px;
    flex-wrap:wrap;
  }
  .filters-left { display:flex; align-items:center; gap:8px; }
  .filters-right { margin-left:auto; display:flex; gap:8px; align-items:flex-start; }

  .chips {
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    flex:1 1 auto;
    min-width:200px;
  }

  .sort-inline { display:flex; gap:8px; align-items:center; margin-left:auto; }

  .pagination {
    margin-top:10px;
    display:flex;
    justify-content:flex-end;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
    color:#111827;
  }
  .pagination .select { padding:6px 8px; }

  .jobs-stage { position:relative; }
  .jobs-stage.open-loader-pending { min-height:152px; }
  .jobs-stage.open-loader-pending #jobs-list { display:none; }

  .open-opportunities-loader {
    position:absolute;
    inset:0 0 auto 0;
    min-height:152px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    color:#4b5563;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .12s ease;
    z-index:1;
  }
  .jobs-stage.open-loader-visible .open-opportunities-loader {
    opacity:1;
    visibility:visible;
  }
  .open-opportunities-loader-art {
    width:180px;
    max-width:70vw;
    height:auto;
  }
  .open-opportunities-loader-label {
    font-size:12px;
    color:#6b7280;
  }
  .open-loader-paper { opacity:0; }
  .jobs-stage.open-loader-visible .open-loader-paw {
    animation:open-loader-paw 2.2s ease-in-out infinite;
  }
  .jobs-stage.open-loader-visible .open-loader-paper {
    animation:open-loader-paper 2.2s ease-in-out infinite;
  }

  @keyframes open-loader-paw {
    0%, 26% { opacity:0; transform:translate(-125px, -20px); }
    30% { opacity:1; transform:translate(-125px, -20px); }
    48% { opacity:1; transform:translate(-165px, -30px); }
    68% { opacity:0; transform:translate(-290px, 15px); }
    79%, 100% { opacity:0; transform:translate(-290px, 15px); }
  }

  @keyframes open-loader-paper {
    0%, 26% { opacity:0; transform:translate(5px, -15px); }
    30% { opacity:1; transform:translate(5px, -15px); }
    48% { opacity:1; transform:translate(-35px, -25px); }
    68% { opacity:1; transform:translate(-160px, 20px); }
    74%, 100% { opacity:0; transform:translate(-160px, 20px); }
  }

  .page-link {
    padding:2px 6px;
    border-radius:6px;
    border:1px solid transparent;
    cursor:pointer;
  }
  .page-link.current {
    border-color:#e5e7eb;
    font-weight:600;
  }

  .linklike {
    background:none;
    border:none;
    padding:0;
    margin:0 6px;
    color:#111827;
    cursor:pointer;
    text-decoration:underline dotted;
  }
  .linklike:hover { text-decoration:underline; }

  .catsbar {
    display:flex;
    align-items:center;
    gap:10px;
    margin:8px 0;
    min-width:0;
  }
  .catsbar .tabs { margin:0; flex-wrap:nowrap; flex-shrink:0; }
  .catsbar .tab { white-space:nowrap; }
  .tab-open-short { display:none; }
  .status-ephemeral { flex:0 0 118px; margin-left:auto; text-align:right; }

  /* Keep the score control outside the tablist and the loading status. */
  .score-control { position:relative; flex:0 0 auto; }
  .score-control[hidden], .score-error[hidden] { display:none !important; }
  .score-editor { display:flex; align-items:center; gap:7px; white-space:nowrap; }
  .score-editor label { font-size:12px; color:#374151; }
  .score-editor input[type="range"] {
    width:124px; height:6px; margin:0 3px;
    appearance:none; -webkit-appearance:none;
    border-radius:999px;
    background:linear-gradient(to right, #6e0503 0%, #373710 50%, #00691c 100%);
    cursor:pointer;
  }
  .score-editor input[type="range"]::-webkit-slider-thumb {
    appearance:none; -webkit-appearance:none;
    background:#fff; border:2px solid #111827; border-radius:50%; width:17px; height:17px;
  }
  .score-editor input[type="range"]::-moz-range-thumb {
    background:#fff; border:2px solid #111827; border-radius:50%; width:13px; height:13px;
  }
  .score-editor input[type="range"]:focus-visible { outline:2px solid #2563eb; outline-offset:6px; }
  .score-color-value { font-variant-numeric:tabular-nums; font-weight:700; }
  .score-editor output { min-width:30px; text-align:center; font-size:13px; }
  .score-apply { padding:5px 8px; font-size:12px; }
  .score-apply:disabled { cursor:default; opacity:.55; }
  .score-error {
    position:absolute; right:0; top:calc(100% + 3px);
    max-width:260px; width:max-content; z-index:4;
    background:#fff7f7; color:#9b1c1c; border:1px solid #e8aaaa;
    border-radius:6px; padding:5px 8px; font-size:12px;
    white-space:normal;
  }
  .score-compact-toggle { display:none; }

  .status-ephemeral {
    font-size:.9rem;
    color:#6b7280;
    transition:opacity .35s ease, visibility .35s ease;
  }
  .status-ephemeral.fade {
    opacity:0;
    visibility:hidden;
  }

  .optlist { display:flex; gap:10px; flex-wrap:wrap; max-width:100%; }
  .opt {
    cursor:pointer;
    text-decoration:underline dotted rgba(17,24,39,.35);
    text-underline-offset:2px;
  }
  .opt:hover { text-decoration-color:rgba(17,24,39,.45); }
  .opt.is-active {
    color:#6b7280;
    text-decoration:none;
    cursor:default;
  }

  .filters-grid {
    display:grid;
    grid-template-columns:160px minmax(0,1fr);
    gap:8px 14px;
    align-items:center;
    margin-bottom:8px;
  }
  .fg-label { font-size:12px; }
  .fg-values {
    min-width:0;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
  }
  .fg-sep {
    grid-column:1 / -1;
    border-top:1px dashed #e5e7eb;
    margin:4px 0;
  }

  .ac-wrap { position:relative; }
  .ac-menu {
    position:absolute;
    left:0;
    right:0;
    top:calc(100% + 2px);
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:8px;
    box-shadow:0 6px 16px rgba(0,0,0,.06);
    z-index:20;
    display:none;
    max-height:240px;
    overflow:auto;
  }
  .ac-item { padding:6px 10px; cursor:pointer; }
  .ac-item[aria-selected="true"],
  .ac-item:hover { background:#f3f4f6; }

  .compat-block.hidden { display:none; }
  .compat-line {
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .compat-hexes {
    font-family:inherit;
    letter-spacing:.02em;
  }
  .compat-score { font-variant-numeric:tabular-nums; }

  @media (prefers-reduced-motion: reduce) {
    .status-ephemeral.is-loading::after { animation:none; }
    .open-opportunities-loader { transition:none; }
    .jobs-stage.open-loader-visible .open-loader-paw,
    .jobs-stage.open-loader-visible .open-loader-paper {
      animation:none;
    }
  }

  @media (max-width: 875px) {
    .catsbar { gap:5px; }
    .catsbar .tabs { gap:4px; }
    .catsbar .tab { padding:6px 7px; font-size:12px; }
    .score-control { margin-left:auto; }
    .score-compact-toggle {
      display:block; padding:5px 7px; border:1px solid #d1d5db;
      border-radius:7px; background:#fff; font-size:12px; cursor:pointer;
      white-space:nowrap;
    }
    .score-editor {
      display:none; position:absolute; right:-30px; top:calc(100% + 5px);
      width:min(330px, calc(100vw - 32px)); box-sizing:border-box; flex-wrap:wrap;
      z-index:10; padding:12px; border:1px solid #d1d5db; border-radius:9px;
      box-shadow:0 6px 18px rgba(0,0,0,.14); background:#fff;
    }
    .score-control.is-open .score-editor { display:flex; }
    .score-error { top:calc(100% + 8px); }
    .score-control.is-open .score-error { top:calc(100% + 67px); }
    .status-ephemeral { flex:0 0 18px; margin-left:0; font-size:0; min-width:18px; }
    .status-ephemeral.is-loading::after {
      content:' '; display:inline-block; width:13px; height:13px;
      border:2px solid #d1d5db; border-top-color:#374151;
      border-radius:50%; animation:score-status-spin .9s linear infinite;
    }
    .status-ephemeral.is-error::after { content:'!'; font-size:14px; font-weight:700; color:#9b1c1c; }
    @keyframes score-status-spin { to { transform:rotate(360deg); } }
  }
  @media (max-width: 440px) {
    .tab-open-short { display:inline; }
    .tab-open-full { display:none; }
    .score-compact-toggle span:first-child { display:none; }
    .score-compact-toggle::before { content:'☷'; margin-right:4px; color:#4b5563; }
    .score-control.is-open .score-error { top:calc(100% + 88px); }
  }
  @media (max-width: 720px) {
    .sort-inline { width:100%; justify-content:flex-end; }
    .pagination { justify-content:center; }
    .catsbar { flex-direction:row; align-items:center; gap:4px; }
  }
</style>
