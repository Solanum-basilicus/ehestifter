title_filter:
  positive:
    - "Product Manager"
    - "Engineering Manager"
  negative:
    - "Junior"
    - "Intern"

location_scope_filter:
  enabled: true
  # A compatible broad scope wins over a blocked scope in mixed listings,
  # e.g. "Remote (Europe or US)" remains eligible.
  allow:
    - "Germany"
    - "Deutschland"
    - "Europe"
    - "European Union"
    - "EU"
    - "EEA"
    - "EMEA"
    - "DACH"
    - "Worldwide"
    - "Anywhere"
  block:
    - "United States"
    - "USA"
    - "US"
    - "Canada"
  restriction_markers:
    - "only"
    - "based"
    - "resident"
    - "residents"
    - "located"
    - "within"
    - "must be"
    - "work authorization"

location_filter:
  always_allow:
    - "Germany"
    - "Berlin"
  allow:
    - "Remote"
    - "Germany"
    - "Berlin"
  block:
    - "United States only"
    - "India"

max_posting_age_days: 30

tracked_companies:
  - name: Celonis
    careers_url: https://job-boards.greenhouse.io/celonis
    enabled: true

  - name: Rainfocus
    careers_url: https://jobs.lever.co/rainfocus
    enabled: true

  - name: n8n
    careers_url: https://jobs.ashbyhq.com/n8n
    enabled: true

# Health-only provider canaries bypass title/location/age filters, never call
# Jobs, and never enter the import candidate list. In offline mode they use
# normal tenant state for cadence; interval_hours defaults to 24.
provider_canaries:
  - name: W. L. Gore CSB protocol canary
    careers_url: https://wlgore.jobs.hr.cloud.sap/
    provider: successfactors
    sf_variant: csb
    sf_listing_url: https://wlgore.jobs.hr.cloud.sap/go/All-Jobs/9813400/
    sf_locales:
      - de_DE
      - en_US
    max_pages: 1
    minimum_jobs: 1
    detail_sample_size: 5
    minimum_detail_successes: 1
    interval_hours: 24
    enabled: false

  # Issue #3 examples are disabled by default. Enable them only after the
  # provider adapter is deployed and a bounded manual canary run succeeds.
  - name: Aisle 518 BambooHR protocol canary
    careers_url: https://aisle518.bamboohr.com/careers
    provider: bamboohr
    minimum_jobs: 1
    detail_sample_size: 3
    minimum_detail_successes: 1
    interval_hours: 24
    enabled: false

  - name: Concept2 BambooHR protocol canary
    careers_url: https://concept2.bamboohr.com/jobs
    provider: bamboohr
    minimum_jobs: 1
    detail_sample_size: 3
    minimum_detail_successes: 1
    interval_hours: 24
    enabled: false

  - name: Rambus iCIMS protocol canary
    careers_url: https://careers-rambus.icims.com
    provider: icims
    max_pages: 1
    minimum_jobs: 1
    detail_sample_size: 3
    minimum_detail_successes: 1
