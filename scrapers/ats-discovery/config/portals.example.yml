    enabled: false

  - name: NV5 iCIMS protocol canary
    careers_url: https://careers-nv5.icims.com
    provider: icims
    max_pages: 1
    minimum_jobs: 1
    detail_sample_size: 3
    minimum_detail_successes: 1
    interval_hours: 24
    enabled: false

  - name: Abby's Catering Paylocity protocol canary
    careers_url: https://recruiting.paylocity.com/Recruiting/Jobs/All/8e0feae7-e42f-437e-97b1-53b917185eed
    provider: paylocity
    minimum_jobs: 1
    detail_sample_size: 3
    minimum_detail_successes: 1
