schema_version: 1

# Compact catalog identities may be used for Ashby, Greenhouse, Lever,
# Personio, SmartRecruiters, Softgarden, and BambooHR. Workday uses
# tenant|instance|site. iCIMS uses the full *.icims.com portal host. Paylocity
# uses the board UUID. SuccessFactors uses the full public HTTPS careers URL
# because branded host/path identity cannot be represented by a short slug.
priority:
  ashby: []
  greenhouse: []
  lever: []
  workday: []
  personio: []
  smartrecruiters: []
  softgarden: []
  successfactors: []
  bamboohr: []
  icims: []
  paylocity: []
  # Example:
  # greenhouse:
  #   - celonis
  # workday:
  #   - example|wd3|External
  # successfactors:
  #   - https://careers.example.com/Brand
  # bamboohr:
  #   - example
  # icims:
  #   - careers-example.icims.com
  # paylocity:
  #   - 73b6525a-3273-48b3-b9d8-d6479233c61c

