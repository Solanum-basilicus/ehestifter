[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ehjobs-proxy"
version = "0.1.0"
description = "Local limited Ehestifter Jobs API proxy for agentic job discovery"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<1.0"
]

[project.scripts]
ehjobs-proxy = "ehjobs_proxy.main:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
