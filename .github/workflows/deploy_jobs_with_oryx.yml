name: Deploy Jobs Function via Oryx (Python v1-decorators)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/jobs/**'
      - 'tools/build_locations_v2_catalog.py'
      - 'tools/tests/test_build_locations_v2_catalog.py'
      - '.github/workflows/deploy_jobs_with_oryx.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './backend/jobs' # must be root where host.json is
  PYTHON_VERSION: '3.11'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: For-deploying-to-Azure
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python for the reference index
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build and validate the Jobs location index
        run: python tools/build_locations_v2_catalog.py --index-only

      - name: Run location index tests (no production calls)
        run: |
          python -m pip install pytest
          python -m pytest -q tools/tests/test_build_locations_v2_catalog.py backend/jobs/tests_unit/test_locations_search_index.py

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions using Oryx
        uses: Azure/functions-action@v1
        with:
          app-name: 'ehestifter-jobs'
          slot-name: 'Production'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          scm-do-build-during-deployment: true
          remote-build: true
          enable-oryx-build: true
